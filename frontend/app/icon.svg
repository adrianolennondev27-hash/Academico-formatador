<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Círculo de fundo com gradiente azul → vermelho -->
  <circle cx="32" cy="32" r="30" fill="url(#fvaGrad)" />

  <!-- Letra F estilizada em branco itálico -->
  <text
    x="32"
    y="45"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="900"
    font-style="italic"
    fill="#ffffff"
    text-anchor="middle"
  >F</text>

  <!-- Asa vermelha no canto superior direito -->
  <path
    d="M 42 14 C 48 12, 54 12, 60 10 C 56 16, 50 20, 42 20 Z"
    fill="#dc2626"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>